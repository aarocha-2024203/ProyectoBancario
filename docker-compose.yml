services:

  postgres:
    image: postgres:15
    container_name: bancario_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ProyectoBancario3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bancario_network

  mongo:
    image: mongo:4.4
    container_name: bancario_mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bancario_network

  auth-service:
    build:
      context: .
      dockerfile: ./ProyectoBancario3/Auth-Service/Dockerfile
    container_name: bancario_auth
    restart: always
    ports:
      - "3005:3005"
    env_file:
      - .env.docker
    environment:
      - PORT=3005
    depends_on:
      postgres:
        condition: service_started
    networks:
      - bancario_network

  banking-service:
    build:
      context: .
      dockerfile: ./ProyectoBancario3/ProyectoBancario/Dockerfile
    container_name: bancario_banking
    restart: always
    ports:
      - "3006:3006"
    env_file:
      - .env.docker
    environment:
      - PORT=3006
    depends_on:
      - mongo
      - postgres
    networks:
      - bancario_network

  web-frontend:
    build:
      context: .
      dockerfile: ./react-app-proyectobanco/Dockerfile
    container_name: bancario_web
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - auth-service
      - banking-service
    networks:
      - bancario_network

networks:
  bancario_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
