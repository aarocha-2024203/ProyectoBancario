services:

  postgres:
    image: postgres:15
    container_name: bancario_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ProyectoBancario3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:4.4
    container_name: bancario_mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  auth-service:
    build: ./Auth-Service
    container_name: bancario_auth
    restart: always
    ports:
      - "3005:3005"
    env_file:
      - ./Auth-Service/.env
    depends_on:
      - postgres

  proyecto-bancario:
    build: ./ProyectoBancario
    container_name: bancario_main
    restart: always
    ports:
      - "3006:3006"
    env_file:
      - ./ProyectoBancario/.env
    depends_on:
      - mongo
      - postgres

volumes:
  postgres_data:
  mongo_data: