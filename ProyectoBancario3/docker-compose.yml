version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: proyectobancario_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
     - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgressql/data

volumes:
  postgres_data:
